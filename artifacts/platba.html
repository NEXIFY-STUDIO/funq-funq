<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Platba</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
    }

    .phone {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 8px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-right svg {
      display: block;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 8px 16px 20px;
    }

    .back-btn {
      position: absolute;
      left: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1c1c1e;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
    }

    .back-btn svg {
      width: 12px;
      height: 20px;
    }

    .header-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    /* Main content */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 20px 0;
    }

    .icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #2d6a3a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .icon-wrap svg {
      width: 32px;
      height: 32px;
    }

    .account-name {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 4px;
    }

    .account-name .chevron {
      opacity: 0.5;
      font-size: 14px;
    }

    .date {
      font-size: 13px;
      color: #8e8e93;
      margin-bottom: 28px;
    }

    .amount {
      font-size: 48px;
      font-weight: 500;
      color: #ff9f0a;
      letter-spacing: -1.5px;
      margin-bottom: 28px;
      font-variant-numeric: tabular-nums;
    }

    /* Action buttons */
    .actions {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 28px;
    }

    .action-btn {
      flex: 1;
      height: 44px;
      border-radius: 22px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      padding: 0 10px;
    }

    .action-btn.blue {
      background: #0a84ff;
      color: #fff;
    }

    .action-btn.teal {
      background: #30b0c7;
      color: #fff;
    }

    .action-btn.gray {
      background: #2c2c2e;
      color: #fff;
      flex: 0.7;
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Details card */
    .details {
      width: 100%;
      background: #1c1c1e;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      min-height: 52px;
    }

    .detail-row + .detail-row {
      border-top: 0.5px solid #38383a;
    }

    .detail-label {
      font-size: 16px;
      color: #fff;
      font-weight: 400;
    }

    .detail-value {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      color: #8e8e93;
    }

    .detail-value .chevron {
      opacity: 0.4;
      font-size: 14px;
      margin-left: 2px;
    }

    .flag {
      width: 22px;
      height: 16px;
      border-radius: 2px;
      overflow: hidden;
      display: inline-block;
      flex-shrink: 0;
    }

    .flag img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .category-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #af52de;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .category-icon svg {
      width: 12px;
      height: 12px;
    }

    .info-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid #8e8e93;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #8e8e93;
      flex-shrink: 0;
      line-height: 1;
    }

    /* Note button */
    .note-btn {
      width: 100%;
      background: #1c1c1e;
      border: none;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      font-size: 16px;
      color: #0a84ff;
      font-weight: 400;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone">
    <!-- Status bar -->
    <div class="status-bar">
      <div class="status-left">19:09</div>
      <div class="status-right">
        <!-- Signal bars -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
          <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#fff"/>
          <rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="#fff"/>
          <rect x="9" y="2" width="3" height="10" rx="0.5" fill="#fff"/>
          <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#fff"/>
        </svg>
        <!-- WiFi -->
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <path d="M8 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" fill="#fff"/>
          <path d="M4.2 7.8a5.5 5.5 0 017.6 0" stroke="#fff" stroke-width="1.4" stroke-linecap="round" fill="none"/>
          <path d="M1.5 5.2a9 9 0 0113 0" stroke="#fff" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        </svg>
        <!-- Battery -->
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none">
          <rect x="0.5" y="0.5" width="22" height="12" rx="2.5" stroke="#fff" stroke-opacity="0.35" fill="none"/>
          <rect x="2" y="2" width="13" height="9" rx="1.5" fill="#fff"/>
          <path d="M24 4.5v4a2 2 0 000-4z" fill="#fff" fill-opacity="0.4"/>
        </svg>
      </div>
    </div>

    <!-- Header -->
    <div class="header">
      <button class="back-btn" aria-label="Späť">
        <svg viewBox="0 0 12 20" fill="none">
          <path d="M10 2L2 10l8 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="header-title">Platba</div>
    </div>

    <!-- Content -->
    <div class="content">
      <!-- Icon -->
      <div class="icon-wrap">
        <svg viewBox="0 0 48 48" fill="none">
          <!-- Money bag - closer to the screenshot style -->
          <path d="M24 8c-2.2 0-4 1.4-4.5 3.5-.3 1.1.1 2.2.8 3L19 17h10l-1.3-2.5c.7-.8 1.1-1.9.8-3C28 9.4 26.2 8 24 8z" fill="#F4C430"/>
          <ellipse cx="24" cy="14" rx="5" ry="2.5" fill="#E8B923"/>
          <path d="M14 18c0-1.5 1.5-3 4-3h12c2.5 0 4 1.5 4 3v16c0 3.5-3 6.5-7 6.5h-6c-4 0-7-3-7-6.5V18z" fill="#F4C430"/>
          <path d="M14 18c0-1.5 1.5-3 4-3h12c2.5 0 4 1.5 4 3" stroke="#E0A820" stroke-width="1" fill="none"/>
          <text x="24" y="32" text-anchor="middle" font-size="14" font-weight="800" fill="#1a5c2e" font-family="-apple-system,Arial,sans-serif">$</text>
        </svg>
      </div>

      <div class="account-name">
        sporiaci účet
        <span class="chevron">›</span>
      </div>
      <div class="date">26. 7. 2026, 18:00</div>

      <div class="amount">115,00 €</div>

      <!-- Action buttons -->
      <div class="actions">
        <button class="action-btn blue">
          <svg viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="9" r="7.5" stroke="#fff" stroke-width="1.6" fill="none"/>
            <path d="M9 5.5v7M9 12.5l-2.2-2.5M9 12.5l2.2-2.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Požiadať o platbu
        </button>
        <button class="action-btn teal">
          <svg viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="9" r="7.5" stroke="#fff" stroke-width="1.6" fill="none"/>
            <path d="M5.5 9h7" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M9 5.5v7" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="9" cy="9" r="1.8" fill="#30b0c7" stroke="#fff" stroke-width="1.2"/>
          </svg>
          Rozdeliť platbu
        </button>
        <button class="action-btn gray">
          <svg viewBox="0 0 18 18" fill="none">
            <circle cx="5" cy="9" r="1.4" fill="#fff"/>
            <circle cx="9" cy="9" r="1.4" fill="#fff"/>
            <circle cx="13" cy="9" r="1.4" fill="#fff"/>
          </svg>
          Viac
        </button>
      </div>

      <!-- Details -->
      <div class="details">
        <div class="detail-row">
          <span class="detail-label">Bankový účet</span>
          <div class="detail-value">
            Nemecký účet
            <span class="flag">
              <!-- German flag as CSS -->
              <svg width="22" height="16" viewBox="0 0 22 16">
                <rect width="22" height="5.33" fill="#000"/>
                <rect y="5.33" width="22" height="5.34" fill="#D00"/>
                <rect y="10.67" width="22" height="5.33" fill="#FFCE00"/>
              </svg>
            </span>
            <span class="chevron">›</span>
          </div>
        </div>
        <div class="detail-row">
          <span class="detail-label">Kategória</span>
          <div class="detail-value">
            Všeobecné
            <span class="category-icon">
              <svg viewBox="0 0 12 12" fill="none">
                <rect x="1" y="1" width="4" height="4" rx="0.8" fill="#fff"/>
                <rect x="7" y="1" width="4" height="4" rx="0.8" fill="#fff"/>
                <rect x="1" y="7" width="4" height="4" rx="0.8" fill="#fff"/>
                <rect x="7" y="7" width="4" height="4" rx="0.8" fill="#fff"/>
              </svg>
            </span>
            <span class="chevron">›</span>
          </div>
        </div>
        <div class="detail-row">
          <span class="detail-label">Odhadované doručenie</span>
          <div class="detail-value">
            Doručené
            <span class="info-icon">i</span>
          </div>
        </div>
      </div>

      <!-- Note button -->
      <button class="note-btn">Pridať poznámku alebo účtenku</button>
    </div>
  </div>
</body>
</html>
